{{ define "main" }}
<div style="max-width: 800px; margin: 40px auto; padding: 0 20px;">
  <h1>Daily Update</h1>
  <a href="https://claude.ai/code/artifact/02db3738-fa2d-4b2f-b840-6ad1efe76d95" target="_blank" rel="noopener" style="display:block;border:1px solid #ddd;border-radius:8px;padding:12px 16px;margin:16px 0 24px;text-decoration:none;">
    <span style="font-weight:600;font-size:1rem;">🛰 AI Scientist Radar</span>
    <span style="color:#888;font-size:0.85rem;margin-left:12px;">매일 자동 업데이트되는 리서치 레이더 ↗</span>
  </a>
  {{ range .Pages.ByDate.Reverse }}
  <div style="padding: 8px 0; border-bottom: 1px solid #eee;">
    <a href="{{ .RelPermalink }}" style="font-weight: 600; font-size: 1rem;">{{ .Title }}</a>
    <span style="color: #888; font-size: 0.85rem; margin-left: 12px;">{{ .Date.Format "2006-01-02" }}</span>
    {{ with .Params.summary }}<p style="margin: 2px 0 0; color: #555; font-size: 0.9rem;">{{ . }}</p>{{ end }}
  </div>
  {{ end }}
</div>
{{ end }}
